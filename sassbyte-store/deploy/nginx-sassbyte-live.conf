server {
    listen 80;
    server_name sassbyte.site www.sassbyte.site sassbyte.store www.sassbyte.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sassbyte.site www.sassbyte.site sassbyte.store www.sassbyte.store;
    root /var/www/sassbyte;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/sassbyte.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sassbyte.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /AI-agent-assistence/README.md { return 404; }
    location = /AI-agent-assistence/test_app.py { return 404; }

    location /openlead/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }

    location /share/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }

    location /rp/static/ {
        alias /var/www/sassbyte/rp/static/;
        try_files $uri $uri/ =404;
    }

    location /resume-presenter/static/ {
        alias /var/www/sassbyte/rp/static/;
        try_files $uri $uri/ =404;
    }

    location /rp/ {
        alias /var/www/sassbyte/rp/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /resume-presenter/ {
        alias /var/www/sassbyte/rp/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}