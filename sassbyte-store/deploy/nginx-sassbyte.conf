server {
    listen 80;
    server_name sassbyte.site www.sassbyte.site sassbyte.store www.sassbyte.store;
    root /var/www/sassbyte;
    index index.html;

    location = /AI-agent-assistence/README.md { return 404; }
    location = /AI-agent-assistence/test_app.py { return 404; }

    location /openlead/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }

    location /share/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }

    location /rp/ {
        alias /var/www/sassbyte/rp/;
        index index.html;
        try_files $uri $uri/ /rp/index.html;
    }

    location /resume-presenter/ {
        alias /var/www/sassbyte/rp/;
        index index.html;
        try_files $uri $uri/ /resume-presenter/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
