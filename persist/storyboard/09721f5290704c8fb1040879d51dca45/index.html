<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mayur Saxena | Resume Storyboard</title><meta property="og:title" content="Mayur Saxena | Resume Storyboard"><meta property="og:description" content="Career story and presentation deck created from a resume."><meta property="og:type" content="website"><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f7ff;color:#171a2d}.wrap{max-width:980px;margin:0 auto;padding:40px 18px 60px}.panel{background:#fff;border:1px solid #dfe6ff;border-radius:22px;box-shadow:0 18px 40px rgba(35,42,87,.12);padding:28px}h1{margin:0 0 10px;font-size:clamp(2rem,4vw,3rem);letter-spacing:-.05em}.sub{color:#5f6888;line-height:1.7}.slide{margin-top:18px;border:1px solid #dde4ff;border-radius:18px;padding:22px;background:#ffffff}.slide h2{margin:0 0 18px;font-size:clamp(1.3rem,3vw,2rem);color:#2f35dd}.item{margin:12px 0;padding-left:16px;border-left:3px solid #ecf0ff}.item b{display:block;margin-bottom:4px}.bar{background:#eef0ff;border-radius:999px;height:12px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4549f5,#7b8bff);border-radius:999px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:#eef0ff;border-radius:16px;padding:16px;text-align:center;border:1px solid #dde4ff}.stat b{display:block;color:#2f35dd;font-size:2rem}.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:12px;padding:10px 18px;background:#4549f5;color:white;cursor:pointer}.muted{color:#5f6888;font-size:14px}@media(max-width:640px){.slide{padding:18px}}</style></head><body><div class="wrap"><div class="panel"><h1>Mayur Saxena</h1><div class="sub">Resume storyboard shared for playback and presentation.</div><div id="deck"></div><div class="nav"><button id="prev">Prev</button><button id="next">Next</button></div></div></div><script>const deckId = '09721f5290704c8fb1040879d51dca45'; let deck = null; let index = 0; const deckNode = document.getElementById('deck'); function render(){ const slide = deck.slides[index]; if (!slide) return; let html = ''; if (slide.t === 'title') { html = '<div class="slide" style="padding:52px 26px;text-align:center"><h2 style="margin-bottom:10px">'+ slide.h + '</h2><div class="sub">'+ (slide.s || '') + '</div></div>'; } else { html = '<div class="slide"><h2>' + slide.h + '</h2>'; const items = slide.items || []; if (slide.t === 'timeline') { html += items.map((x) => '<div class="item"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join(''); } if (slide.t === 'list') { html += items.map((x) => '<div class="item"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join(''); } if (slide.t === 'skills') { html += items.map((x) => '<div class="item"><b>' + x[0] + '</b><div class="bar"><i data-w="' + x[1] + '\"></i></div></div>').join(''); } if (slide.t === 'stats') { html += '<div class="stats">' + items.map((x) => '<div class="stat"><b>' + x[0] + '</b><div>' + x[1] + '</div></div>').join('') + '</div>'; } html += '</div>'; } deckNode.innerHTML = html; document.querySelectorAll('[data-w]').forEach((bar) => { bar.style.width = bar.dataset.w + '%'; }); } document.getElementById('next').onclick = () => { if (!deck) return; index = Math.min(index + 1, deck.slides.length - 1); render(); }; document.getElementById('prev').onclick = () => { if (!deck) return; index = Math.max(index - 1, 0); render(); }; fetch('/api/share/' + deckId).then((r) => r.json()).then((data) => { deck = data; render(); }).catch(() => { deckNode.innerHTML = '<div class="slide"><h2>Storyboard unavailable</h2><div class="sub">This shared deck could not be loaded.</div></div>'; }); </script></body></html>
